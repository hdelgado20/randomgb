name: Build Game Boy
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar GBDK
        run: |
          wget -q https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-linux64.tar.gz
          tar xzf gbdk-linux64.tar.gz -C "$RUNNER_TEMP"
          echo "GBDK_HOME=$RUNNER_TEMP/gbdk" >> "$GITHUB_ENV"
      - name: Compilar
        run: |
          MK=$(find . -maxdepth 3 -name Makefile -not -path './.git/*' | head -n 1)
          if [ -z "$MK" ]; then
            echo "No encuentro el Makefile. Archivos del repositorio:"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          cd "$(dirname "$MK")"
          make
      - uses: actions/upload-artifact@v4
        with:
          name: DiscoAleatorio-gb
          path: |
            **/DiscoAleatorio.gb
